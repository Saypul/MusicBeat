name: Desktop · Windows

# Builds the Windows installer, MSI and portable zip. jpackage only packages for
# the OS it runs on, so this needs a Windows runner; the APKs stay on their own
# workflow. Run it by hand with "publish" to release it as windows-v<version>.
# Windows releases are never marked "latest": that stays on the phone's v<version>
# releases, which older phone builds read, and each app's updater only reads its
# own tags.
on:
  push:
    branches: [desktop]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages (blank: the phone's version from build.gradle.kts)"
        required: false
      publish:
        description: "Publish as release windows-v<version> (otherwise artifacts only)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows · installer, msi, portable
    runs-on: windows-latest
    env:
      SIGNPATH_ON: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: WiX Toolset 3
        shell: pwsh
        run: |
          $url = "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip"
          Invoke-WebRequest -Uri $url -OutFile wix.zip
          Expand-Archive wix.zip -DestinationPath "$env:RUNNER_TEMP\wix"
          "$env:RUNNER_TEMP\wix" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Work out the version
        id: version
        shell: bash
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version=$(sed -n 's/^extra\["musicbeatVersionName"\] = "\(.*\)"/\1/p' build.gradle.kts)
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "LISTEN_TOGETHER_SERVER=${{ secrets.LISTEN_TOGETHER_SERVER }}" >> local.properties

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopUi:jvmTest :desktopApp:test "-Pmusicbeat.version=${{ steps.version.outputs.value }}"

      - name: Build msi, exe and the app image
        run: .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable "-Pmusicbeat.version=${{ steps.version.outputs.value }}"

      - name: The natives and models are in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/MusicBeat/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/musicbeat_analysis.dll'
          jar tf "$jar" | grep -q 'native/musicbeat_smtc.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Collect
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.value }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item desktopApp/build/compose/binaries/main/msi/*.msi "dist/MusicBeat-$v-windows-x64.msi"
          Copy-Item desktopApp/build/compose/binaries/main/exe/*.exe "dist/MusicBeat-$v-windows-x64-setup.exe"
          # From inside app/, so the zip holds MusicBeat\ and not the build path.
          Push-Location desktopApp/build/compose/binaries/main/app
          7z a -tzip -mx=5 "$env:GITHUB_WORKSPACE/dist/MusicBeat-$v-windows-x64-portable.zip" MusicBeat | Out-Null
          Pop-Location
          Get-ChildItem dist | Format-Table Name, Length

      - name: Checksums
        shell: bash
        run: (cd dist && sha256sum MusicBeat-* > "SHA256SUMS-windows-${{ steps.version.outputs.value }}")

      - id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: musicbeat-windows-${{ steps.version.outputs.value }}${{ env.SIGNPATH_ON == 'true' && '-unsigned' || '' }}
          path: dist/*

      # Code signing through SignPath Foundation, once the project is accepted
      # (see docs/CODE_SIGNING.md). Until SIGNPATH_API_TOKEN is set the files
      # ship unsigned. SignPath signs the installer, the MSI and the launcher
      # inside the portable zip, per .signpath/artifact-configuration.xml.
      - name: Sign with SignPath
        if: env.SIGNPATH_ON == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: musicbeat
          signing-policy-slug: ${{ inputs.publish && 'release-signing' || 'test-signing' }}
          artifact-configuration-slug: windows
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Use the signed files
        if: env.SIGNPATH_ON == 'true'
        shell: bash
        run: |
          rm -rf dist && mv signed dist
          (cd dist && rm -f SHA256SUMS-* && sha256sum MusicBeat-* > "SHA256SUMS-windows-${{ steps.version.outputs.value }}")
          ls -l dist

      - uses: actions/upload-artifact@v4
        if: env.SIGNPATH_ON == 'true'
        with:
          name: musicbeat-windows-${{ steps.version.outputs.value }}
          path: dist/*

      - name: Publish windows-v${{ steps.version.outputs.value }}
        if: inputs.publish
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="windows-v${{ steps.version.outputs.value }}"
          gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest=false \
              --title "MusicBeat for Windows ${{ steps.version.outputs.value }}" \
              --notes "MusicBeat for Windows (beta). Not code-signed: SmartScreen shows \"Windows protected your PC\"; choose More info, then Run anyway."
          gh release upload "$tag" dist/* --clobber --repo "${{ github.repository }}"
